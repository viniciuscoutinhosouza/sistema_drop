[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]
exclude = ["tests/", "migrations/", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in default arguments (FastAPI uses this)
    "B904",  # raise from None in except (Oracle driver compat)
    "E402",  # module level import not at top (intentional: routers after app setup, lifespan patterns)
    "E712",  # avoid == True/False (intentional: SQLAlchemy ORM filter pattern throughout codebase)
    "E741",  # ambiguous variable name (l/O/I acceptable in list comprehensions in this codebase)
    "E701",  # multiple statements on one line (try/except one-liners used in existing code)
    "E711",  # == None / != None (intentional: SQLAlchemy ORM filter pattern throughout codebase)
]

[tool.ruff.lint.isort]
known-first-party = ["routers", "models", "services", "tasks"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/", "migrations/"]
# Oracle driver stubs nao existem — ignorar
[[tool.mypy.overrides]]
module = ["oracledb.*", "sqlalchemy.*", "passlib.*", "jose.*", "apscheduler.*", "socketio.*", "xmltodict.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: testes que requerem Oracle ATP configurado no .env",
    "unit: testes que rodam sem banco de dados",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
