# Dev overrides: hot-reload for backend, skip frontend build
# Usage: docker compose up (picks up this file automatically)
services:
  backend:
    build:
      context: ./BACKEND
      dockerfile: Dockerfile
    volumes:
      - ./BACKEND:/app          # mount source for hot reload
      - uploads_data:/app/static/uploads
    command: uvicorn main:socket_app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"

  frontend:
    # In dev, run frontend with Vite (npm run dev) outside Docker
    # Comment this service out or keep as-is
    profiles:
      - prod
