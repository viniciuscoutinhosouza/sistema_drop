name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend-quality:
    name: Backend — Lint, Type Check & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: BACKEND/requirements.txt

      - name: Install dependencies
        working-directory: BACKEND
        run: pip install -r requirements.txt

      - name: Lint with ruff
        working-directory: BACKEND
        run: ruff check .

      - name: Format check with ruff
        working-directory: BACKEND
        run: ruff format --check .

      - name: Type check with mypy
        working-directory: BACKEND
        run: mypy . --ignore-missing-imports
        continue-on-error: true  # mypy warnings don't block CI initially

      - name: Run unit tests (no Oracle required)
        working-directory: BACKEND
        env:
          ORACLE_USER: ci_user
          ORACLE_PASSWORD: ci_password
          ORACLE_DSN: ci_dsn
          JWT_SECRET: ci_secret_key_for_github_actions_32chars
          CORS_ORIGINS: http://localhost:5173
        run: pytest tests/ -m "not integration" -v --tb=short

  frontend-quality:
    name: Frontend — Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: FRONTEND/package-lock.json

      - name: Install dependencies
        working-directory: FRONTEND
        run: npm ci

      - name: Build check
        working-directory: FRONTEND
        run: npm run build
